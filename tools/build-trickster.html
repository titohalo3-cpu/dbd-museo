function cnv(w,h,draw){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=4;
  return t;
}

    g.beginPath(); g.ellipse(Math.random()*w,Math.random()*h,ir(5,28),ir(4,16),Math.random()*3,0,Math.PI*2); g.fill();

});

const UP=V(0,1,0);

function bone(a,b,rA,rB,mat,seg=12){
  const dir=new THREE.Vector3().subVectors(b,a);
  const len=dir.length();
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rB,rA,len,seg,1),mat);
  m.position.copy(a).addScaledVector(dir,0.5);
  m.quaternion.setFromUnitVectors(UP,dir.clone().normalize());
  return m;
}
function ball(p,r,mat,sx=1,sy=1,sz=1){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),mat);
  m.position.copy(p); m.scale.set(sx,sy,sz);
  return m;
}
function box(w,h,d,p,mat,rx=0,ry=0,rz=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.copy(p); m.rotation.set(rx,ry,rz);
  return m;
}
function quad(a,b,c,d,mat){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute([...a,...b,...c,...d],3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute([0,0,1,0,1,1,0,1],2));
  g.setIndex([0,1,2,0,2,3]);
  g.computeVertexNormals();
  return new THREE.Mesh(g,mat);
}
/* casco de arco: y0 abajo, y1 arriba; a0/a1 en radianes (0 = +Z, frente) */
function arcShell(y0,y1,r0,r1,a0,a1,mat,seg=56,jag=0){
  const pos=[],uv=[],idx=[];
  for(let i=0;i<=seg;i++){
    const t=i/seg, a=a0+(a1-a0)*t;
    const yb=y0 + (jag?Math.sin(i*2.3)*jag*0.5+(i%5===0?-jag:0):0);
    pos.push(Math.sin(a)*r1, y1, Math.cos(a)*r1);
    pos.push(Math.sin(a)*r0, yb, Math.cos(a)*r0);
    uv.push(t,1,t,0);
  }
  for(let i=0;i<seg;i++){
    const a=i*2;
    idx.push(a,a+2,a+1, a+1,a+2,a+3);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return new THREE.Mesh(g,mat);
}
function chain(p0,p1,sag,n,mat,linkR=0.012,tube=0.0035){
  const dir=new THREE.Vector3().subVectors(p1,p0);
  for(let i=0;i<n;i++){
    const t=(i+0.5)/n;
    const p=new THREE.Vector3().copy(p0).addScaledVector(dir,t);
    p.y-=Math.sin(Math.PI*t)*sag;
    const m=new THREE.Mesh(new THREE.TorusGeometry(linkR,tube,5,10),mat);
    m.position.copy(p);
    m.quaternion.setFromUnitVectors(V(0,0,1),dir.clone().normalize());
    root.add(m);
  }
}

    root.add(t);
  }
  root.add(box(0.03,0.028,0.018,V(x+(x<0?-0.078:0.078),0.255,z+0.01),metalMat));
  root.add(box(0.026,0.024,0.016,V(x+(x<0?-0.08:0.08),0.34,z+0.005),metalMat));
}

/* ============================ bate ============================ */
const b0=V(-0.255,1.975,0.035);
const b1=V(0.60,1.76,-0.42);
const bdir=new THREE.Vector3().subVectors(b1,b0).normalize();
const batQ=new THREE.Quaternion().setFromUnitVectors(V(0,0,1),bdir);

root.add(bone(b0,b1,0.024,0.05,woodMat,16));
root.add(bone(b0,b0.clone().addScaledVector(bdir,0.24),0.028,0.027,darkMat,12)); // grip
root.add(ball(b0,0.033,metalMat));
root.add(bone(b1.clone().addScaledVector(bdir,-0.02),b1.clone().addScaledVector(bdir,0.03),0.052,0.045,woodMat,16));

// alambre de espino
const wire=new THREE.Group();
wire.position.copy(b0).addScaledVector(bdir,0.72);
wire.quaternion.copy(batQ);
{
  const pts=[];
  for(let i=0;i<=200;i++){
    const t=i/200, ang=t*Math.PI*13;
    pts.push(new THREE.Vector3(Math.cos(ang)*0.055, Math.sin(ang)*0.055, -0.20+0.40*t));
  }
  wire.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),220,0.0055,5,false),metalMat));
  for(let i=0;i<10;i++){
    const p=pts[Math.round(i*20)];
    const sp=new THREE.Mesh(new THREE.ConeGeometry(0.008,0.03,4),metalMat);
    sp.position.copy(p);
    sp.rotation.z=Math.random()*Math.PI;
    sp.rotation.x=Math.random()*Math.PI;
    wire.add(sp);
  }
}
root.add(wire);

// dedos agarrando el bate
for(let i=0;i<4;i++){
  const p=b0.clone().addScaledVector(bdir,0.015+i*0.031);
  const t=new THREE.Mesh(new THREE.TorusGeometry(0.031,0.0105,6,12),skinMat);
  t.position.copy(p); t.quaternion.copy(batQ);
  root.add(t);
}
root.add(bone(V(-0.29,1.945,0.06),V(-0.245,1.995,0.06),0.014,0.011,skinMat));

/* ============================ sangre en el pecho ============================ */
const drips=[
  [-0.038,1.552,1.335,0.0065],[0.012,1.545,1.245,0.0055],[0.062,1.512,1.395,0.0045]
];
for(const [x,y0,y1,r] of drips){
  root.add(bone(V(x,y0,0.112),V(x+0.004,y1,0.100),r,r*0.35,bloodMat));
  root.add(ball(V(x+0.006,y1-0.012,0.104),0.010,bloodMat,0.7,1.3,0.5));
}

/* ============================ escena / preview ============================ */
root.updateMatrixWorld(true);
const bounds=new THREE.Box3().setFromObject(root);
const size=bounds.getSize(new THREE.Vector3());
const min=bounds.min;
// pies a y=0 y cuerpo centrado
root.position.set(0,-min.y,0);
root.updateMatrixWorld(true);

const scene=new THREE.Scene();
scene.background=new THREE.Color('#101014');
scene.add(root);
scene.add(new THREE.HemisphereLight('#dfe4ff','#2a1c14',0.7));
const d1=new THREE.DirectionalLight('#ffe0b0',1.8); d1.position.set(3,5,4); scene.add(d1);
const d2=new THREE.DirectionalLight('#8fa8ff',0.5); d2.position.set(-4,3,-3); scene.add(d2);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const cam=new THREE.PerspectiveCamera(35,window.innerWidth/window.innerHeight,0.1,60);
cam.position.set(2.6,1.9,3.6);
cam.lookAt(0,1.0,0);
renderer.render(scene,cam);
window.__VIEW__={scene,renderer,cam,root};

const tris=(()=>{let n=0; root.traverse(o=>{ if(o.isMesh&&o.geometry.index) n+=o.geometry.index.count/3; }); return Math.round(n);})();
const meshes=(()=>{let n=0; root.traverse(o=>{ if(o.isMesh) n++; }); return n;})();
const mats=new Set();
root.traverse(o=>{ if(o.isMesh) mats.add(o.material); });
log('mallas: '+meshes+'  triángulos: '+tris+'  materiales: '+mats.size);
log('alto: '+size.y.toFixed(3)+' m  ancho: '+size.x.toFixed(3)+'  fondo: '+size.z.toFixed(3));
window.__INFO__={meshes,tris,materials:mats.size,height:+size.y.toFixed(3),width:+size.x.toFixed(3),depth:+size.z.toFixed(3)};

const exporter=new GLTFExporter();
exporter.parse(root, buf=>{
  log('GLB: '+(buf.byteLength/1048576).toFixed(2)+' MB');
  fetch('/save?name=trickster.glb',{method:'POST',body:buf})
    .then(r=>r.json())
    .then(j=>{ log('GUARDADO '+JSON.stringify(j)); window.__DONE__=j; })
    .catch(e=>{ log('ERROR guardando: '+e); window.__ERROR__=String(e); });
}, err=>{ log('ERROR exportando: '+err); window.__ERROR__=String(err); },
{ binary:true, onlyVisible:true });
</script>
</body></html>
